<form action="/register" method="post">

    <div>
        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            required
        >
    </div>

    <div>
        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >
    </div>

    <div>
        <label>Email</label>
        <input
            type="email"
            name="email"
            required
        >
    </div>

    <div>
        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >
    </div>

    <button type="submit">
        Create Account
    </button>

</form>
